name: lightchat
description: A lightweight chat interface for local LLMs powered by Ollama

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Estado
  provider: ^6.0.5
  
  # HTTP y API
  html: ^0.15.6
  http: ^1.1.2
  
  # Almacenamiento
  shared_preferences: ^2.2.2

  # Documentos (arrastrar y soltar, selector de archivos, PDF, Excel)
  desktop_drop: ^0.8.4
  file_selector: ^1.0.3
  syncfusion_flutter_pdf: ^35.1.41
  archive: ^4.0.7
  xml: ^7.1.0
  
  # Imágenes
  image_picker: ^1.0.4

  # Markdown de las respuestas
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  
  # Ventana
  window_manager: ^0.5.2
  
  # Hardware
  system_info2: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
